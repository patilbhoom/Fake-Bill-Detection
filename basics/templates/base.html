
<!DOCTYPE html>
<html>
<head>
    <title>Base</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url("https://png.pngtree.com/thumb_back/fh260/back_our/20190620/ourmid/pngtree-tech-robot-hand-business-banner-image_162870.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: 'Times New Roman', Times, serif;
            font-size: x-large;
        }

        .navbar {
            background-color: rgba(0, 0, 0, 0.5);
            width: 100%;
            padding: 10px 0;
        }

        .nav-link {
            color: rgb(12, 191, 149);
        }

        .content {
            padding: 20px;
        }
    </style>
</head>
<body>
    <ul class="nav nav-pills nav-fill navbar">
        <li class="nav-item">
            <a class="nav-link" href="{% url 'homepage' %}">Home</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{% url 'About' %}">About Us</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{% url 'Project' %}">Project</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{% url 'Predict' %}">Predict</a>
        </li>
    </ul>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
